<body>

  <!-- GTM (noscript) -->

    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5MHCHMHC"

  </noscript>

  <!-- React App -->
  <div id="root"><!--app-html--></div>

  <div class="live-chat-container" id="liveChatContainer">
    <div class="live-chat-header">
      <div class="user-info">
        <div class="avatar"><i class="fas fa-user"></i></div>
        <div class="user-details">
          <h2>Admin Support</h2>
          <p class="status">Online</p>
        </div>
      </div>
      <div class="chat-actions">
        <button onclick="window.liveChatOperation && window.liveChatOperation()" class="action-btn close-chat-btn">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
    <div class="live-chat-messages" id="chatBox"></div>
    <div class="message-input-container">
      <div class="input-wrapper">
        <input type="text" id="messageInput" placeholder="Type a message">
      </div>
      <button class="send-btn" onclick="window.sendMessage && window.sendMessage()">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <div id="chatbot-container"
    data-key="WJ7Vitr1kuP5UtQX10hjIvfh3QXV8twrYqB7xo4leYDQatWIU2JvNN16GAGig0Wx">
  </div>

  <!-- Loader shown until React hydrates -->
  <div id="loader" class="loader"></div>

  <!--preloaded-state-->

  <script defer src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
  <script defer src="https://js.pusher.com/7.0/pusher.min.js"></script>
  <script defer src="https://arsinfotech.in/chatbot/admin/public/chatbot/chatbot.js"></script>
  <script defer src="https://arsinfotech.in/chatbot/admin/public/livechat/user.js"></script>
  <script defer src="https://www.google.com/recaptcha/api.js?render=6Leef4opAAAAAIHXI82ZE6l8ezbNjJe2_1nwDlUH"></script>

  <!-- React Client Entry -->
  <script type="module" src="/src/entry-client.tsx"></script>

  <script>
    window.addEventListener("load", function () {
      if (window.grecaptcha && window.grecaptcha.ready) {
        window.grecaptcha.ready(function () {
          window.grecaptcha.execute("6Leef4opAAAAAIHXI82ZE6l8ezbNjJe2_1nwDlUH", { action: "submit" })
            .then(function (token) {
              var el = document.querySelector(".g-recaptcha-response");
              if (el) {
                el.value = token;
              }
            });
        });
      }
    });
  </script>

<script>
  const updateChatMessage = () => {
    const element = document.querySelector(".message-content");

    if (!element) {
      return false;
    }

    element.innerHTML = `
      Clear All Doubts Instantly.<br>
      <small>Chat with Us Instantly!</small>
    `;

    return true;
  };

  if (!updateChatMessage()) {
    let attempts = 0;
    const forceUpdate = setInterval(() => {
      attempts += 1;

      if (updateChatMessage() || attempts >= 40) {
        clearInterval(forceUpdate);
      }
    }, 250);
  }
</script>
</body>
