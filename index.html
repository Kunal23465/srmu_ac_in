    <!-- Google Tag Manager: delayed until after first paint/idle on production hosts -->
    <script>
      (function () {
        var allowedHosts = ["srmu.ac.in", "www.srmu.ac.in"];

        if (allowedHosts.indexOf(window.location.hostname) === -1) {
          return;
        }

        var loaded = false;
        var loadGtm = function () {
          if (loaded) return;
          loaded = true;

          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({
            "gtm.start": new Date().getTime(),
            event: "gtm.js",
          });

          var firstScript = document.getElementsByTagName("script")[0];
          var gtmScript = document.createElement("script");
          gtmScript.async = true;
          gtmScript.src = "https://www.googletagmanager.com/gtm.js?id=GTM-5MHCHMHC";
          firstScript.parentNode.insertBefore(gtmScript, firstScript);
        };

        window.addEventListener("load", function () {
          if ("requestIdleCallback" in window) {
            window.requestIdleCallback(loadGtm, { timeout: 4500 });
          } else {
            window.setTimeout(loadGtm, 3500);
          }
        });
      })();
    </script>

    <!-- Loader shown until React hydrates -->
    <div id="loader" class="loader"></div>

    <!--preloaded-state-->

    <script>
      // Load legacy live-chat script only when its DOM container exists.
      if (document.getElementById("liveChatContainer")) {
        const liveChatScript = document.createElement("script");
        liveChatScript.defer = true;
        liveChatScript.src = "https://arsinfotech.in/chatbot/admin/public/livechat/user.js";
        document.head.appendChild(liveChatScript);
      }
    </script>
    <script>
      (function () {
        var loaded = false;
        var loadRecaptcha = function () {
          if (loaded) return;
          loaded = true;
          var recaptchaScript = document.createElement("script");
          recaptchaScript.async = true;
          recaptchaScript.defer = true;
          recaptchaScript.src = "https://www.google.com/recaptcha/api.js?render=6Leef4opAAAAAIHXI82ZE6l8ezbNjJe2_1nwDlUH";
          document.head.appendChild(recaptchaScript);
        };

        window.addEventListener("pointerdown", loadRecaptcha, { once: true, passive: true });
        window.addEventListener("keydown", loadRecaptcha, { once: true });
        window.addEventListener("load", function () {
          if ("requestIdleCallback" in window) {
            window.requestIdleCallback(loadRecaptcha, { timeout: 9000 });
          } else {
            window.setTimeout(loadRecaptcha, 7000);
          }
        });
      })();
    </script>
