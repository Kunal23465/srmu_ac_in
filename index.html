<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Best University in Lucknow | Shri Ramswaroop Memorial University (SRMU)</title>
  <meta
    name="description"
    content="Study at Shri Ramswaroop Memorial University (SRMU), a leading private university in Lucknow offering BTech, MBA, BBA, BCA and more."
  />
  <link rel="icon" type="image/png" href="./src/assets/images/fav-icon.png" />
  <!-- explicitly load Tailwind CSS early to avoid flash -->
  <link rel="stylesheet" href="/src/index.css" />

  <meta name="google-site-verification" content="_nb6X6f1snggKhVVVCB8IrIDgoQumS9jt7LhEw_Khig" />

  <!-- Google Tag Manager -->
  <script>
    (function (w, d, s, l, i) {
      w[l] = w[l] || [];
      w[l].push({
        "gtm.start": new Date().getTime(),
        event: "gtm.js",
      });
      var f = d.getElementsByTagName(s)[0],
        j = d.createElement(s),
        dl = l != "dataLayer" ? "&l=" + l : "";
      j.async = true;
      j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
      f.parentNode.insertBefore(j, f);
    })(window, document, "script", "dataLayer", "GTM-5MHCHMHC");
  </script>

  <!-- Helmet SSR meta placeholders -->
  <!--helmet-head-->

  <style>
    .grecaptcha-badge {
      visibility: hidden !important;
    }

  </style>
  <style>
    @media(max-width:767px) {
      #parrotBot .chat-toggle { bottom: 50px !important; }
      .chatbot-message-bubble { bottom: 50px !important; }
    }
  </style>

</head>

<body>

  <!-- GTM (noscript) -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5MHCHMHC"
      height="0" width="0"
      style="display:none;visibility:hidden"></iframe>
  </noscript>

  <!-- Meta Pixel noscript -->
  <noscript>
    <img height="1" width="1" style="display:none" alt="Facebook pixel"
      src="https://www.facebook.com/tr?id=600748770079503&ev=PageView&noscript=1" />
  </noscript>

  <!-- React App -->
  <div id="root"><!--app-html--></div>

  <div class="live-chat-container" id="liveChatContainer">
    <div class="live-chat-header">
      <div class="user-info">
        <div class="avatar"><i class="fas fa-user"></i></div>
        <div class="user-details">
          <h2>Admin Support</h2>
          <p class="status">Online</p>
        </div>
      </div>
      <div class="chat-actions">
        <button onclick="window.liveChatOperation && window.liveChatOperation()" class="action-btn close-chat-btn">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
    <div class="live-chat-messages" id="chatBox"></div>
    <div class="message-input-container">
      <div class="input-wrapper">
        <input type="text" id="messageInput" placeholder="Type a message">
      </div>
      <button class="send-btn" onclick="window.sendMessage && window.sendMessage()">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <div id="chatbot-container"
    data-key="WJ7Vitr1kuP5UtQX10hjIvfh3QXV8twrYqB7xo4leYDQatWIU2JvNN16GAGig0Wx">
  </div>

  <!-- Loader shown until React hydrates -->
  <div id="loader" class="loader"></div>

  <!--preloaded-state-->

  <!-- React Client Entry -->
  <script type="module" src="/src/entry-client.tsx"></script>

  <script>
    const loadedStyles = new Set();
    const loadedScripts = new Set();

    const loadStyle = (href) => {
      if (loadedStyles.has(href)) {
        return;
      }

      loadedStyles.add(href);
      const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = href;
      document.head.appendChild(link);
    };

    const loadScript = (src) => {
      if (loadedScripts.has(src)) {
        return Promise.resolve();
      }

      loadedScripts.add(src);

      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.defer = true;
        script.onload = resolve;
        script.onerror = reject;
        document.body.appendChild(script);
      });
    };

    const loadMetaPixel = async () => {
      if (window.fbq) {
        return;
      }

      const fbq = function () {
        if (fbq.callMethod) {
          fbq.callMethod.apply(fbq, arguments);
        } else {
          fbq.queue.push(arguments);
        }
      };

      fbq.queue = [];
      fbq.loaded = true;
      fbq.version = "2.0";
      fbq.push = fbq;
      window.fbq = fbq;
      window._fbq = fbq;

      await loadScript("https://connect.facebook.net/en_US/fbevents.js");

      window.fbq("init", "600748770079503");
      window.fbq("track", "PageView");
    };

    const loadClarity = async () => {
      if (window.clarity) {
        return;
      }

      const clarity = function () {
        clarity.q = clarity.q || [];
        clarity.q.push(arguments);
      };

      window.clarity = clarity;

      await loadScript("https://www.clarity.ms/tag/o9lqqntpki");
    };

    const loadAnalyticsAssets = async () => {
      loadStyle("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css");

      await Promise.allSettled([
        loadMetaPixel(),
        loadClarity(),
      ]);
    };

    const loadNonCriticalAssets = async () => {
      loadStyle("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css");
      loadStyle("https://arsinfotech.in/chatbot/admin/public/livechat/user_style.css");

      try {
        await loadScript("https://code.jquery.com/jquery-3.6.1.min.js");
        await loadScript("https://js.pusher.com/7.0/pusher.min.js");
        await Promise.all([
          loadScript("https://arsinfotech.in/chatbot/admin/public/chatbot/chatbot.js"),
          loadScript("https://arsinfotech.in/chatbot/admin/public/livechat/user.js"),
          loadScript("https://www.google.com/recaptcha/api.js?render=6Leef4opAAAAAIHXI82ZE6l8ezbNjJe2_1nwDlUH"),
        ]);
      } catch (_error) {
        return;
      }

      if (window.grecaptcha && window.grecaptcha.ready) {
        window.grecaptcha.ready(function () {
          window.grecaptcha.execute("6Leef4opAAAAAIHXI82ZE6l8ezbNjJe2_1nwDlUH", { action: "submit" })
            .then(function (token) {
              var el = document.querySelector(".g-recaptcha-response");
              if (el) {
                el.value = token;
              }
            });
        });
      }

      if (!updateChatMessage()) {
        let attempts = 0;
        const forceUpdate = setInterval(() => {
          attempts += 1;

          if (updateChatMessage() || attempts >= 40) {
            clearInterval(forceUpdate);
          }
        }, 250);
      }
    };

    const scheduleIdleTask = (callback, delay = 1200) => {
      const schedule = window.requestIdleCallback || function (cb) { return setTimeout(cb, delay); };
      schedule(callback);
    };

    window.addEventListener("load", function () {
      scheduleIdleTask(loadAnalyticsAssets, 800);
      scheduleIdleTask(loadNonCriticalAssets, 1600);
    });
    const updateChatMessage = () => {
      const element = document.querySelector(".message-content");

      if (!element) {
        return false;
      }

      element.innerHTML = `
        Clear All Doubts Instantly.<br>
        <small>Chat with Us Instantly!</small>
      `;

      return true;
    };
  </script>
</body>
</html>
