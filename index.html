  <!-- React Entry -->
  <script type="module" src="/src/entry-client.tsx"></script>

  <!-- Recaptcha -->
  <script>
    window.addEventListener("load", function () {
      if (window.grecaptcha && window.grecaptcha.ready) {
        window.grecaptcha.ready(function () {
          window.grecaptcha.execute("6Leef4opAAAAAIHXI82ZE6l8ezbNjJe2_1nwDlUH", { action: "submit" })
            .then(function (token) {
              var el = document.querySelector(".g-recaptcha-response");
              if (el) el.value = token;
            });
        });
      }
    });
  </script>

  <!-- Chat Message Update -->
  <script>
    const updateChatMessage = () => {
      const el = document.querySelector(".message-content");
      if (!el) return false;

      el.innerHTML = `Clear All Doubts Instantly.<br><small>Chat with Us Instantly!</small>`;
      return true;
    };

    if (!updateChatMessage()) {
      let attempts = 0;
      const interval = setInterval(() => {
        attempts++;
        if (updateChatMessage() || attempts >= 40) clearInterval(interval);
      }, 250);
    }
  </script>
