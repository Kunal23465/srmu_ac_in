name: Deploy Srmu_ac_in UI

on:
  push:
    branches:
      - Dev
  pull_request:
    branches:
      - Dev

jobs:
  build-and-deploy:
    runs-on: dev   # self-hosted runner label

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Vite SSR
        run: npm run build

      - name: Restart SSR server with PM2
        if: github.event_name == 'push'
        run: |
          pm2 restart srmu-ac || pm2 start "npx tsx server.ts" --name srmu-ac
          pm2 save
