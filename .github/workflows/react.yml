
name: Deploy SRMU-LIVE-PRE Next SSR App

on:
  push:
    branches:
      - srmupre
  workflow_dispatch:

jobs:
  deploy:
    runs-on: pre

    steps:
      - name: Verify Ubuntu user
        run: |
          sudo -u ubuntu -H bash -lc '
            whoami
            cd /home/ubuntu/srmu_live/SRMU_AC_IN_UI
            pwd
          '

      - name: Configure Git safe directory
        run: |
          sudo -u ubuntu -H git config --global --add safe.directory /home/ubuntu/srmu_live/SRMU_AC_IN_UI

      - name: Pull latest code
        run: |
          sudo -u ubuntu -H bash -lc '
            cd /home/ubuntu/srmu_live/SRMU_AC_IN_UI
            git pull origin srmupre
          '

      - name: Install dependencies
        run: |
          sudo -u ubuntu -H bash -lc '
            cd /home/ubuntu/srmu_live/SRMU_AC_IN_UI
            npm install
          '

      - name: Build application
        run: |
          sudo -u ubuntu -H bash -lc '
            cd /home/ubuntu/srmu_live/SRMU_AC_IN_UI
            npm run Build
          '

      - name: Restart PM2 application
        run: |
          sudo -u ubuntu -H bash -lc '
            pm2 restart srmu-live
          '
