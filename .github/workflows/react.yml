name: Deploy Srmu_ac_in UI

on:
  push:
    branches:
      - Dev
  pull_request:
    branches:
      - Dev

jobs:
  build-and-deploy:
    runs-on: dev   # 👈 self-hosted runner label

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build React app
        run: npm run build

      - name: Deploy build to Nginx directory
        if: github.event_name == 'push'
        run: |
           rm -rf /var/www/vhost/srmuacin/*
           cp -R dist/* /var/www/vhost/srmuacin/

      - name: Reload Nginx
        if: github.event_name == 'push'
        run: systemctl reload nginx
