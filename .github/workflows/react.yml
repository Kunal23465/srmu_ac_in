
name: Deploy SRMU-LIVE-PRE Next SSR App

on:
  push:
    branches:
      - srmupre
  workflow_dispatch:

jobs:
  deploy:
    runs-on: pre

    steps:
      - name: Verify Ubuntu environment
        run: |
          runuser -u ubuntu -- bash -ic '
            set -e
            cd /home/ubuntu/srmu_live/SRMU_AC_IN_UI

            echo "User: $(whoami)"
            echo "Directory: $(pwd)"
            echo "Node: $(command -v node)"
            echo "npm: $(command -v npm)"
            echo "PM2: $(command -v pm2)"

            node -v
            npm -v
          '

      - name: Configure Git safe directory
        run: |
          runuser -u ubuntu -- git config --global --add safe.directory /home/ubuntu/srmu_live/SRMU_AC_IN_UI

      - name: Pull latest code
        run: |
          runuser -u ubuntu -- bash -ic '
            set -e
            cd /home/ubuntu/srmu_live/SRMU_AC_IN_UI
            git pull origin srmupre
          '

      - name: Install dependencies
        run: |
          runuser -u ubuntu -- bash -ic '
            set -e
            cd /home/ubuntu/srmu_live/SRMU_AC_IN_UI
            npm install
          '

      - name: Build application
        run: |
          runuser -u ubuntu -- bash -ic '
            set -e
            cd /home/ubuntu/srmu_live/SRMU_AC_IN_UI
            npm run Build
          '

      - name: Restart PM2 application
        run: |
          runuser -u ubuntu -- bash -ic '
            set -e
            export HOME=/home/ubuntu
            export PM2_HOME=/home/ubuntu/.pm2
            pm2 restart srmu-live
            pm2 status
          '
