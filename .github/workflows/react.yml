name: Deploy Srmu_ac_in UI

on:
  push:
    branches:
      - Dev
  pull_request:
    branches:
      - Dev

jobs:
  build-and-deploy:
    runs-on: dev   # self-hosted runner label

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync project to deployment folder
        run: |
          rsync -av --delete ./ /home/ubuntu/srmuac/SRMU_AC_IN_UI/

      - name: Install dependencies
        run: |
          cd /home/ubuntu/srmuac/SRMU_AC_IN_UI
          npm ci --legacy-peer-deps

      - name: Build Vite SSR
        run: |
          cd /home/ubuntu/srmuac/SRMU_AC_IN_UI
          npm run build

      - name: Restart SSR server with PM2
        if: github.event_name == 'push'
        run: |
          cd /home/ubuntu/srmuac/SRMU_AC_IN_UI
          pm2 describe srmu-ac > /dev/null 2>&1 \
            && pm2 reload srmu-ac \
            || pm2 start server.ts --name srmu-ac --interpreter tsx
          pm2 save
